<!DOCTYPE html>
<html>
<head>
    <title>Test Photo Import</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Photo Import Test</h1>
    
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#importPhotosModal">
        📷 Import Photos
    </button>
    
    <!-- Modal -->
    <div class="modal fade" id="importPhotosModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Import Photos</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="file" id="photoZipFile" accept=".zip" class="form-control">
                    <div id="photoImportResult" style="display: none; margin-top: 10px;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="submitPhotoImportBtn">Import</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
console.log('Script loaded');

function setupPhotoImport() {
    console.log('setupPhotoImport called');
    let btn = document.getElementById('submitPhotoImportBtn');
    console.log('Button found:', !!btn);
    if (!btn) return;
    
    btn.onclick = function() {
        console.log('Button clicked!');
        alert('Button works!');
    };
}

if (document.readyState === 'loading') {
    console.log('Document loading...');
    document.addEventListener('DOMContentLoaded', setupPhotoImport);
} else {
    console.log('Document already ready');
    setupPhotoImport();
}
</script>
</body>
</html>
