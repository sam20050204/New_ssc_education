{% extends "inventory/base.html" %}
{% load static %}

{% block page_title %}Edit Purchase{% endblock %}

{% block content %}
{{ block.super }}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="form-section">
            <h2>Edit Purchase</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <hr>
                <div class="d-flex gap-2 justify-content-end">
                    <a href="{% url 'inventory:item-detail' purchase.item.pk %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
