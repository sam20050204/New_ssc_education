<div class="sidebar-shell">
    <div class="sidebar-brand">
        <button id="sidebar-collapse-toggle-sales" class="sidebar-brand-toggle" type="button" aria-label="Toggle sidebar" title="Hide sidebar">
            <div class="sidebar-brand-mark">SA</div>
            <div class="sidebar-brand-copy">
                <strong>Sales Suite</strong>
                <span>Sales & services dashboard</span>
            </div>
            <i class="fa-solid fa-chevron-left"></i>
        </button>
    </div>

    <div class="sidebar-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" placeholder="Search menu..." oninput="filterSalesSidebarMenu(this.value)">
    </div>

    <div class="sidebar-scroll" id="salesSidebarScroll">
        <div class="sidebar-group">
            <div class="sidebar-label">Dashboard</div>
            <a href="{% url 'sales_services_dashboard' %}" class="menu-item {% if active_page == 'sales_dashboard' %}active{% endif %}" data-menu-label="sales dashboard services dashboard">
                <i class="fa-solid fa-chart-pie"></i><span>Dashboard</span>
            </a>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-label">Inventory</div>
            <a href="{% url 'inventory:item-list' %}" class="menu-item {% if active_page == 'inventory_items' %}active{% endif %}" data-menu-label="inventory items product stock finished register">
                <i class="fa-solid fa-boxes-stacked"></i><span>Items</span>
            </a>
            <a href="{% url 'inventory:add-stock' %}" class="menu-item {% if active_page == 'inventory_add_stock' %}active{% endif %}" data-menu-label="inventory add stock record purchase supplier purchase">
                <i class="fa-solid fa-cart-plus"></i><span>Add Stock</span>
            </a>
            <a href="{% url 'inventory:category-list' %}" class="menu-item {% if active_page == 'inventory_categories' %}active{% endif %}" data-menu-label="inventory categories item category list">
                <i class="fa-solid fa-layer-group"></i><span>Categories</span>
            </a>
            <a href="{% url 'inventory:supplier-list' %}" class="menu-item {% if active_page == 'inventory_suppliers' %}active{% endif %}" data-menu-label="inventory suppliers vendor supplier list">
                <i class="fa-solid fa-truck-field"></i><span>Suppliers</span>
            </a>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-label">Navigation</div>
            <a href="{% url 'education_home' %}" class="menu-item" data-menu-label="computer education dashboard">
                <i class="fa-solid fa-arrow-left"></i><span>Back to Education</span>
            </a>
        </div>
    </div>
</div>

<script>
const salesSidebarScrollKey = 'sales-sidebar-scroll-top';

function persistSalesSidebarScroll() {
    const sidebarScroll = document.getElementById('salesSidebarScroll');
    if (!sidebarScroll) return;
    localStorage.setItem(salesSidebarScrollKey, String(sidebarScroll.scrollTop || 0));
}

function filterSalesSidebarMenu(query) {
    const normalized = String(query || '').trim().toLowerCase();
    document.querySelectorAll('#salesSidebarScroll [data-menu-label]').forEach(function(item) {
        const visible = !normalized || item.getAttribute('data-menu-label').includes(normalized) || item.textContent.toLowerCase().includes(normalized);
        item.style.display = visible ? '' : 'none';
    });
}

document.addEventListener('DOMContentLoaded', function() {
    const sidebarScroll = document.getElementById('salesSidebarScroll');
    if (sidebarScroll) {
        const savedTop = parseInt(localStorage.getItem(salesSidebarScrollKey) || '0', 10);
        if (!Number.isNaN(savedTop)) {
            sidebarScroll.scrollTop = savedTop;
        }

        sidebarScroll.addEventListener('scroll', persistSalesSidebarScroll, { passive: true });
    }

    document.querySelectorAll('#salesSidebarScroll a').forEach(function(item) {
        item.addEventListener('click', persistSalesSidebarScroll);
    });
});
</script>
