<nav class="sidebar">
    <a href="{% url 'dashboard' %}"
       class="menu-item {% if active_page == 'dashboard' %}active{% endif %}">
        🖥️ Dashboard
    </a>

    <a href="{% url 'statistics' %}"
       class="menu-item {% if active_page == 'statistics' %}active{% endif %}">
        📈 Statistics
    </a>

    <a href="{% url 'enquiry_list' %}"
       class="menu-item {% if active_page == 'enquiries' %}active{% endif %}">
        🔍 Enquiries
    </a>

    <!-- Students Section with Submenu -->
    <div class="menu-section">
        <button class="menu-item menu-toggle" onclick="toggleStudentsMenu(this)">
            👨‍🎓 Students
            <span class="toggle-icon">▶</span>
        </button>
        <div class="submenu">
            <a href="{% url 'new_admission' %}"
               class="submenu-item {% if active_page == 'new_admission' %}active{% endif %}">
                ➕ New Admission
            </a>
            <a href="{% url 'admitted_students' %}"
               class="submenu-item {% if active_page == 'admitted_students' %}active{% endif %}">
                👥 All Students
            </a>
            <a href="{% url 'fees_payment' %}"
               class="submenu-item {% if active_page == 'fees_payment' %}active{% endif %}">
                💳 Fees Payment
            </a>
            <a href="{% url 'receipts_view' %}"
               class="submenu-item {% if active_page == 'receipts' %}active{% endif %}">
                📄 Receipts
            </a>
            <a href="{% url 'payment_tracking' %}"
               class="submenu-item {% if active_page == 'payment_tracking' %}active{% endif %}">
                💰 Payment Tracking
            </a>
        </div>
    </div>

    <!-- Attendance Section with Submenu -->
    <div class="menu-section">
        <button class="menu-item menu-toggle" onclick="toggleAttendanceMenu(this)">
            📋 Attendance
            <span class="toggle-icon">▶</span>
        </button>
        <div class="submenu">
            <a href="{% url 'student_timetable' %}"
               class="submenu-item {% if active_page == 'student_timetable' %}active{% endif %}">
                📚 Student Timetable
            </a>
            <a href="{% url 'batch_overview' %}"
               class="submenu-item {% if active_page == 'batch_overview' %}active{% endif %}">
                📊 Batch Overview
            </a>
            <a href="{% url 'mark_attendance' %}"
               class="submenu-item {% if active_page == 'mark_attendance' %}active{% endif %}">
                ✏️ Mark Attendance
            </a>
            <a href="{% url 'attendance_reports' %}"
               class="submenu-item {% if active_page == 'attendance_reports' %}active{% endif %}">
                📈 Attendance Reports
            </a>
        </div>
    </div>

    <!-- Database Backup Management -->
    <a href="{% url 'backup_page' %}"
       class="menu-item {% if active_page == 'backup' %}active{% endif %}">
        💾 Backup
    </a>

    <!-- Logout as a form to handle POST request properly -->
    <form method="post" action="{% url 'logout' %}" style="margin: 0;">
        {% csrf_token %}
        <button type="submit" class="menu-item logout-item">
            🚪 Logout
        </button>
    </form>
</nav>

<script>
function toggleStudentsMenu(button) {
    const submenu = button.nextElementSibling;
    const icon = button.querySelector('.toggle-icon');
    
    submenu.classList.toggle('active');
    icon.classList.toggle('rotated');
}

function toggleAttendanceMenu(button) {
    const submenu = button.nextElementSibling;
    const icon = button.querySelector('.toggle-icon');
    
    submenu.classList.toggle('active');
    icon.classList.toggle('rotated');
}

// On page load, expand Students menu if we're on a student-related page
document.addEventListener('DOMContentLoaded', function() {
    const activeSubmenuItem = document.querySelector('.submenu-item.active');
    if (activeSubmenuItem) {
        const submenu = activeSubmenuItem.closest('.submenu');
        const button = submenu.previousElementSibling;
        
        // Keep the submenu expanded
        submenu.classList.add('active');
        button.querySelector('.toggle-icon').classList.add('rotated');
    }
});
</script>
