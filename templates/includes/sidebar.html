<nav class="sidebar">
    <div class="sidebar-header">
        <button id="sidebar-toggle" class="sidebar-toggle-btn" title="Toggle sidebar visibility">
            <span class="sidebar-icon">☰</span>
        </button>
    </div>

    <a href="{% url 'dashboard' %}" class="menu-item {% if active_page == 'dashboard' %}active{% endif %}">
        Dashboard
    </a>

    <a href="{% url 'statistics' %}" class="menu-item {% if active_page == 'statistics' %}active{% endif %}">
        Statistics
    </a>

    <a href="{% url 'enquiry_list' %}" class="menu-item {% if active_page == 'enquiries' %}active{% endif %}">
        Enquiries
    </a>

    <div class="menu-section">
        <button class="menu-item menu-toggle" onclick="toggleMenu(this, 'menu-students-open')">
            Students
            <span class="toggle-icon">▶</span>
        </button>
        <div class="submenu">
            <a href="{% url 'new_admission' %}" class="submenu-item {% if active_page == 'new_admission' %}active{% endif %}">New Admission</a>
            <a href="{% url 'admitted_students' %}" class="submenu-item {% if active_page == 'admitted_students' %}active{% endif %}">All Students</a>
            <a href="{% url 'fees_payment' %}" class="submenu-item {% if active_page == 'fees_payment' %}active{% endif %}">Fees Payment</a>
            <a href="{% url 'receipts_view' %}" class="submenu-item {% if active_page == 'receipts' %}active{% endif %}">Receipts</a>
            <a href="{% url 'payment_tracking' %}" class="submenu-item {% if active_page == 'payment_tracking' %}active{% endif %}">Payment Tracking</a>
        </div>
    </div>

    <div class="menu-section">
        <button class="menu-item menu-toggle" onclick="toggleMenu(this, 'menu-attendance-open')">
            Attendance
            <span class="toggle-icon">▶</span>
        </button>
        <div class="submenu">
            <a href="{% url 'student_timetable' %}" class="submenu-item {% if active_page == 'student_timetable' %}active{% endif %}">Student Timetable</a>
            <a href="{% url 'batch_overview' %}" class="submenu-item {% if active_page == 'batch_overview' %}active{% endif %}">Batch Overview</a>
            <a href="{% url 'mark_attendance' %}" class="submenu-item {% if active_page == 'mark_attendance' %}active{% endif %}">Mark Attendance</a>
            <a href="{% url 'attendance_reports' %}" class="submenu-item {% if active_page == 'attendance_reports' %}active{% endif %}">Attendance Reports</a>
        </div>
    </div>

    <div class="menu-section">
        <button class="menu-item menu-toggle" onclick="toggleMenu(this, 'menu-batch-open')">
            Batch Management
            <span class="toggle-icon">▶</span>
        </button>
        <div class="submenu">
            <a href="{% url 'active_batches' %}" class="submenu-item {% if active_page == 'active_batches' %}active{% endif %}">Active Batches</a>
            <a href="{% url 'end_batch' %}" class="submenu-item {% if active_page == 'end_batch' %}active{% endif %}">End Batch</a>
            <a href="{% url 'ended_batches' %}" class="submenu-item {% if active_page == 'ended_batches' %}active{% endif %}">Ended Batches</a>
            <a href="{% url 'restore_batch' %}" class="submenu-item {% if active_page == 'restore_batch' %}active{% endif %}">Restore Batch</a>
            <a href="{% url 'batch_reports' %}" class="submenu-item {% if active_page == 'batch_reports' %}active{% endif %}">Batch Reports</a>
        </div>
    </div>

    <a href="{% url 'backup_page' %}" class="menu-item {% if active_page == 'backup' %}active{% endif %}">
        Backup
    </a>

    <form method="post" action="{% url 'logout' %}" style="margin: 0;">
        {% csrf_token %}
        <button type="submit" class="menu-item logout-item">
            Logout
        </button>
    </form>
</nav>

<script>
function toggleMenu(button, storageKey) {
    const submenu = button.nextElementSibling;
    const icon = button.querySelector('.toggle-icon');
    submenu.classList.toggle('active');
    icon.classList.toggle('rotated');
    localStorage.setItem(storageKey, submenu.classList.contains('active'));
}

document.addEventListener('DOMContentLoaded', function() {
    const menuKeys = {
        'Students': 'menu-students-open',
        'Attendance': 'menu-attendance-open',
        'Batch Management': 'menu-batch-open'
    };

    document.querySelectorAll('.menu-section').forEach(section => {
        const button = section.querySelector('.menu-toggle');
        const submenu = section.querySelector('.submenu');
        const icon = button.querySelector('.toggle-icon');
        const text = button.textContent.trim();

        let storageKey = '';
        Object.keys(menuKeys).forEach(label => {
            if (text.includes(label)) {
                storageKey = menuKeys[label];
            }
        });

        if (!storageKey) {
            return;
        }

        const shouldBeOpen = localStorage.getItem(storageKey) === 'true';
        submenu.classList.toggle('active', shouldBeOpen);
        icon.classList.toggle('rotated', shouldBeOpen);
        if (!shouldBeOpen) {
            localStorage.setItem(storageKey, 'false');
        }
    });
});
</script>
