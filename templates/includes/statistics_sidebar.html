<div class="sidebar-shell">
    <div class="sidebar-brand">
        <div class="sidebar-brand-mark">ST</div>
        <div class="sidebar-brand-copy">
            <strong>Statistics</strong>
            <span>Analytics workspace</span>
        </div>
    </div>

    <div class="sidebar-scroll" id="statisticsSidebarScroll">
        <div class="sidebar-group">
            <div class="sidebar-label">Navigation</div>
            <a href="{% url 'dashboard' %}" class="menu-item {% if active_page == 'dashboard' %}active{% endif %}" data-menu-label="dashboard home">
                <i class="fa-solid fa-chart-pie"></i><span>Dashboard</span>
            </a>
            <a href="{% url 'statistics' %}" class="menu-item {% if active_page == 'statistics' %}active{% endif %}" data-menu-label="statistics analytics reports">
                <i class="fa-solid fa-chart-simple"></i><span>Statistics</span>
            </a>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-label">Reports</div>
            <a href="{% url 'student_finance_details' %}" class="menu-item {% if active_page == 'student_finance_details' %}active{% endif %}" data-menu-label="student finance profit fees">
                <i class="fa-solid fa-wallet"></i><span>Student Finance Details</span>
            </a>
            <a href="{% url 'month_wise_admission' %}" class="menu-item {% if active_page == 'month_wise_admission' %}active{% endif %}" data-menu-label="month wise admissions yearly admissions">
                <i class="fa-solid fa-calendar-days"></i><span>Month Wise Admission</span>
            </a>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-label">Account</div>
            <form method="post" action="{% url 'logout' %}" style="margin: 0;">
                {% csrf_token %}
                <button type="submit" class="menu-item menu-item-button" data-menu-label="logout sign out">
                    <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
                </button>
            </form>
        </div>
    </div>
</div>
