{% if messages %}
<div class="toast-stack" id="toastStack">
    {% for message in messages %}
        <div class="erp-toast erp-toast-{{ message.tags|default:'info' }}">
            <div class="toast-icon">
                {% if message.tags == 'success' %}
                    <i class="fa-solid fa-circle-check"></i>
                {% elif message.tags == 'error' %}
                    <i class="fa-solid fa-circle-xmark"></i>
                {% elif message.tags == 'warning' %}
                    <i class="fa-solid fa-triangle-exclamation"></i>
                {% else %}
                    <i class="fa-solid fa-circle-info"></i>
                {% endif %}
            </div>
            <div class="toast-copy">{{ message }}</div>
            <button type="button" class="toast-close" onclick="this.parentElement.remove()" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    {% endfor %}
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.erp-toast').forEach(function(toast, index) {
        setTimeout(function() {
            toast.classList.add('show');
        }, index * 120);
        if (!toast.classList.contains('erp-toast-error')) {
            setTimeout(function() {
                toast.remove();
            }, 5200 + index * 150);
        }
    });
});
</script>
{% endif %}
