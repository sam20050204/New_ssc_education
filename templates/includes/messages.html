<!-- Django Messages Framework Integration -->
<!-- Usage: {% include 'includes/messages.html' %} in base.html -->

{% if messages %}
<div class="container-fluid">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show mt-3" role="alert">
            <div class="d-flex align-items-start">
                <!-- Icon based on message type -->
                {% if message.tags == 'success' %}
                    <i class="fas fa-check-circle text-success me-3" style="font-size: 1.25rem; flex-shrink: 0;"></i>
                {% elif message.tags == 'error' %}
                    <i class="fas fa-exclamation-circle text-danger me-3" style="font-size: 1.25rem; flex-shrink: 0;"></i>
                {% elif message.tags == 'warning' %}
                    <i class="fas fa-exclamation-triangle text-warning me-3" style="font-size: 1.25rem; flex-shrink: 0;"></i>
                {% elif message.tags == 'info' %}
                    <i class="fas fa-info-circle text-info me-3" style="font-size: 1.25rem; flex-shrink: 0;"></i>
                {% else %}
                    <i class="fas fa-bell me-3" style="font-size: 1.25rem; flex-shrink: 0;"></i>
                {% endif %}
                
                <!-- Message Content -->
                <div class="flex-grow-1">
                    {{ message }}
                </div>
                
                <!-- Close Button -->
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
    {% endfor %}
</div>

<style>
    .alert {
        border: none;
        border-radius: 0.375rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        animation: slideDown 0.3s ease-out;
    }
    
    .alert-success {
        background-color: #d1e7dd;
        color: #0f5132;
        border-left: 4px solid #198754;
    }
    
    .alert-error {
        background-color: #f8d7da;
        color: #842029;
        border-left: 4px solid #dc3545;
    }
    
    .alert-warning {
        background-color: #fff3cd;
        color: #664d03;
        border-left: 4px solid #ffc107;
    }
    
    .alert-info {
        background-color: #cfe2ff;
        color: #084298;
        border-left: 4px solid #0d6efd;
    }
    
    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    @media (max-width: 576px) {
        .alert {
            margin-top: 1rem !important;
            margin-left: -12px;
            margin-right: -12px;
            border-radius: 0;
        }
    }
</style>

<script>
    // Auto-close alerts after 5 seconds (optional)
    document.addEventListener('DOMContentLoaded', function() {
        const alerts = document.querySelectorAll('.alert:not(.alert-error)');
        alerts.forEach(alert => {
            setTimeout(() => {
                const bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            }, 5000);
        });
    });
</script>
{% endif %}

<!-- Message Display Guide:

In your Django views, use:

    from django.contrib import messages
    
    # Success Message (Green)
    messages.success(request, "✅ Operation completed successfully!")
    
    # Error Message (Red)
    messages.error(request, "❌ An error occurred!")
    
    # Warning Message (Yellow)
    messages.warning(request, "⚠️ Warning: Please review!")
    
    # Info Message (Blue)
    messages.info(request, "ℹ️ Information: Note this!")

Message Tags Mapping:
- messages.SUCCESS → alert-success (green)
- messages.ERROR → alert-error (red)
- messages.WARNING → alert-warning (yellow)
- messages.INFO → alert-info (blue)

Auto-close Feature:
Messages (except errors) automatically close after 5 seconds.
Users can manually close any message with the × button.

Bootstrap Color Scheme:
- Success: Green (#198754)
- Error: Red (#dc3545)
- Warning: Yellow (#ffc107)
- Info: Blue (#0d6efd)
-->
