<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#667eea" opacity="0.1" stroke="#667eea" stroke-width="2"/>
  
  <!-- Graduation Cap -->
  <g transform="translate(50, 35)">
    <!-- Cap -->
    <path d="M -20 5 L 0 -15 L 20 5 Z" fill="#667eea" stroke="#667eea" stroke-width="2" stroke-linejoin="round"/>
    <!-- Board -->
    <rect x="-22" y="5" width="44" height="3" fill="#667eea"/>
    <!-- Tassel -->
    <line x1="0" y1="8" x2="0" y2="20" stroke="#667eea" stroke-width="2"/>
    <circle cx="0" cy="22" r="2" fill="#667eea"/>
  </g>
  
  <!-- Book/Document -->
  <g transform="translate(50, 65)">
    <rect x="-15" y="-5" width="30" height="20" fill="none" stroke="#667eea" stroke-width="2" rx="2"/>
    <line x1="-5" y1="-5" x2="-5" y2="15" stroke="#667eea" stroke-width="1"/>
    <line x1="0" y1="-2" x2="10" y2="-2" stroke="#667eea" stroke-width="1"/>
    <line x1="0" y1="2" x2="10" y2="2" stroke="#667eea" stroke-width="1"/>
    <line x1="0" y1="6" x2="10" y2="6" stroke="#667eea" stroke-width="1"/>
  </g>
</svg>